version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      egui:
        patterns: ["egui*", "eframe", "epaint*", "emath"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Its tags pick the Rust version: `@1.85` is the MSRV check, `@stable`
      # follows releases. Neither is an action version to bump.
      - dependency-name: dtolnay/rust-toolchain
