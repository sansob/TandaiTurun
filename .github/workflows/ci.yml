name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Library list (Help → About) is up to date
        run: python3 scripts/gen-credits.py && git diff --exit-code crates/tandaiturun/credits.tsv

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Export the examples to PDF and HTML
        shell: bash
        run: |
          mkdir -p out
          for f in examples/*.md; do
            n=$(basename "$f" .md)
            cargo run -q --locked -p tandaiturun -- --export-pdf "$f" "out/$n.pdf"
            cargo run -q --locked -p tandaiturun -- --export-html "$f" "out/$n.html"
          done
          ls -l out
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: example-exports
          path: out/*

  msrv:
    name: MSRV (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p tandaiturun-core --locked

  # Starts the app under Xvfb in each documented scene and keeps the screenshots.
  screenshots:
    name: App starts (Xvfb screenshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb libgl1-mesa-dri
      - run: cargo build --locked -p tandaiturun
      - run: OUT=shots BIN=target/debug/tandaiturun scripts/screenshots.sh
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots/*.png

  # Builds the .deb, .rpm and AppImage and installs them on clean Ubuntu and
  # Fedora containers (same scripts as the release).
  linux-packages:
    name: Linux packages (.deb, .rpm, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-packages
      - name: Install dependencies and packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev desktop-file-utils
          cargo install cargo-deb cargo-generate-rpm --locked
          curl -sSLf -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - run: cargo build --release --locked --workspace
      - name: Package
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APPIMAGETOOL=$PWD/appimagetool packaging/linux/build-packages.sh "$V" x86_64 dist
      - name: Install and start on Ubuntu and Fedora
        run: packaging/linux/test-packages.sh dist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-package-screenshots
          path: dist/screenshots/*

  windows-installer:
    name: Windows installer builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer with a stand-in binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stub | Out-Null
          Set-Content stub\tandaiturun.exe "stub"
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0 /DArch=x64 "/DSourceDir=..\..\stub" packaging\windows\tandaiturun.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
