name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: TandaiTurun version
      placeholder: "0.1.0 (Help → About or `tandaiturun --version`)"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux (X11), Linux (Wayland), Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what you got.
    validations: { required: true }
  - type: textarea
    id: extra
    attributes:
      label: A Markdown file that shows the problem, screenshots
